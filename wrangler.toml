name = "clash-config"
main = "src/index.tsx"
compatibility_date = "2025-04-09"
[vars]
AUTH_USERNAME="admin" # 开发环境的用户名
AUTH_PASSWORD="admin" # 开发环境的密码
[[env.dev.vars]]
AUTH_USERNAME="admin" # 预览环境的用户名
AUTH_PASSWORD="admin" # 预览环境的密码
[[env.preview.vars]]
# KV 命名空间配置
[[kv_namespaces]]
binding = "CLASH_CONFIG_KV"
id = "ed1628e6ab6743eab57628db7f109576" # 将在实际部署时替换为生产环境的 KV ID
# 开发服务器配置
[dev]
port = 8787
local_protocol = "http"
name = "clash-config"
main = "src/index.tsx"
compatibility_date = "2025-04-12"

# KV 命名空间配置
[[kv_namespaces]]
binding = "CLASH_SUBS"
id = "your-kv-id-in-production" # 将在实际部署时替换为生产环境的 KV ID
preview_id = "your-preview-kv-id" # 将在实际预览时替换为预览环境的 KV ID

# 环境配置
[env.development]
AUTH_USERNAME="admin" # 开发环境的用户名
AUTH_PASSWORD="admin" # 开发环境的密码
# 开发环境 KV 配置
[[env.development.kv_namespaces]]
binding = "CLASH_SUBS"
id = "development-kv-id" # 开发环境的 KV ID

[env.production]
# 生产环境配置

# 开发服务器配置
[dev]
port = 8787
local_protocol = "http"